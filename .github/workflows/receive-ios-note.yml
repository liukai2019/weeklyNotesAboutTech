name: Receive iOS Note

on:
  workflow_dispatch:
    inputs:
      text:
        description: Markdown content to append
        required: true
        type: string
      source:
        description: Source of the note
        required: false
        default: ios-shortcut
        type: string

permissions:
  contents: write

concurrency:
  group: receive-ios-note
  cancel-in-progress: false

jobs:
  save-note:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Append note
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "AI工作区域"

          file="AI工作区域/$(TZ=Asia/Shanghai date +'%Y-%m-%d').md"

          {
            echo ""
            echo "## $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S %z')"
            echo ""
            echo "**source:** ${{ inputs.source }}"
            echo ""
            cat <<'EOF'
${{ inputs.text }}
EOF
            echo ""
          } >> "$file"

          echo "NOTE_FILE=$file" >> "$GITHUB_ENV"

      - name: Commit note
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ios-note-bot"
          git config user.email "ios-note-bot@users.noreply.github.com"

          git add "$NOTE_FILE"
          git commit -m "Append iOS note: $(basename "$NOTE_FILE" .md)" || echo "No changes"
          git push
