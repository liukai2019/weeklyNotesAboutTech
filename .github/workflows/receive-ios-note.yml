name: Receive iOS Note

on:
  workflow_dispatch:
    inputs:
      text:
        description: Base64-encoded Markdown content to append
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: receive-ios-note
  cancel-in-progress: false

jobs:
  save-note:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Decode and append note
        shell: bash
        env:
          NOTE_TEXT_BASE64: ${{ inputs.text }}
        run: |
          set -euo pipefail
          mkdir -p "AI工作区域"

          decoded_note="$(mktemp)"
          trap 'rm -f "$decoded_note"' EXIT

          if ! printf '%s' "$NOTE_TEXT_BASE64" | base64 --decode > "$decoded_note"; then
            echo "::error::The text input is not valid Base64."
            exit 1
          fi

          file="AI工作区域/$(TZ=Asia/Shanghai date +'%Y-%m-%d').md"

          {
            echo ""
            echo "## $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S %z')"
            echo ""
            cat "$decoded_note"
            echo ""
          } >> "$file"

          echo "NOTE_FILE=$file" >> "$GITHUB_ENV"

      - name: Commit note
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ios-note-bot"
          git config user.email "ios-note-bot@users.noreply.github.com"
          git add -f "$NOTE_FILE"
          git commit -m "Append iOS note: $(basename "$NOTE_FILE" .md)" || echo "No changes"
          git push
