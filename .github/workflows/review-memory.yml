name: Review Memory

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: review-memory
  cancel-in-progress: false

jobs:
  review-memory:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate memory review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REF_NAME: master
        run: python scripts/review_memory.py

      - name: Send review to QQ Mail
        shell: bash
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: |
          set -euo pipefail

          review_file="reviews/$(TZ=Asia/Shanghai date +'%Y-%m-%d')-review.md"
          test -f "$review_file"

          REVIEW_FILE="$review_file" python - <<'PY'
          import os
          import re
          import smtplib
          import ssl
          import urllib.parse
          from email.message import EmailMessage
          from pathlib import Path

          sender = os.environ.get("QQ_EMAIL", "").strip()
          auth_code = os.environ.get("QQ_SMTP_AUTH_CODE", "").strip()
          review_file = Path(os.environ["REVIEW_FILE"])

          if not sender:
              raise SystemExit("Missing required GitHub secret: QQ_EMAIL")
          if not auth_code:
              raise SystemExit("Missing required GitHub secret: QQ_SMTP_AUTH_CODE")

          review = review_file.read_text(encoding="utf-8")
          summary_match = re.search(
              r"^## 6\\. .*$([\\s\\S]*?)(?=^## \\d+\\. |\\Z)",
              review,
              re.MULTILINE,
          )
          summary = (
              summary_match.group(1).strip()
              if summary_match
              else "本次记忆复习已经生成，请通过下面的链接查看完整内容。"
          )

          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repository = os.environ["GITHUB_REPOSITORY"]
          review_path = urllib.parse.quote(review_file.as_posix())
          review_url = f"{server_url}/{repository}/blob/master/{review_path}"

          message = EmailMessage()
          message["Subject"] = f"记忆复习 {review_file.stem.removesuffix('-review')}"
          message["From"] = sender
          message["To"] = sender
          message.set_content(
              "本次记忆复习已生成。\\n\\n"
              f"简要摘要：\\n{summary}\\n\\n"
              f"完整内容：{review_url}\\n"
          )

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=context) as smtp:
              smtp.login(sender, auth_code)
              smtp.send_message(message)

          print(f"Sent {review_file} to {sender}")
          PY
